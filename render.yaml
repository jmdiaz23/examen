databases:
  - name: examen-db
    databaseName: examen
    user: examen
    plan: free
    region: oregon

services:
  - type: web
    name: examen
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Examenes
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: es
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://examen.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: examen-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: examen-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: examen-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: examen-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: examen-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
